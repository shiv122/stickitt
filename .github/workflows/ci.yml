name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The release workflow runs this first.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  test:
    name: Clippy and tests (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          # Intel runner: GitHub's arm64 macOS pool is often short of capacity.
          - name: macOS
            os: macos-15-intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --locked

  linux:
    name: Linux
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev libx11-dev libxkbcommon-dev \
            kwin-wayland xwayland dbus-x11 xdotool wl-clipboard \
            python3-gi python3-xlib python3-pil desktop-file-utils
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check native build dependencies
        run: pkg-config --exists gtk+-3.0 x11 xkbcommon
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - name: Build Linux package
        run: bash scripts/package-linux.sh
      - name: Installer regression
        run: python3 scripts/test-linux-package.py
      - name: Desktop integration
        run: python3 scripts/test-linux.py --binary target/release/stickit
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/Stick-itt-*-linux-*.tar.gz*
          if-no-files-found: error
