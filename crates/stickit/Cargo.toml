[package]
name = "stickit"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[dependencies]
winit = "0.30"
softbuffer = "0.4"
tiny-skia = "0.12"
cosmic-text = { version = "0.19", features = ["shape-run-cache"] }
rusqlite = { version = "0.41", features = ["bundled"] }
arboard = { version = "3.7", default-features = false }
unicode-segmentation = "1.13"
dirs = "7"
bytemuck = "1"
springs = "0.1"
emojis = "0.9"
global-hotkey = "0.9"
tray-icon = { version = "0.21", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[build-dependencies]
winresource = "0.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# macOS: present our own premultiplied-alpha pixels through Core Animation (see surface.rs).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFCGTypes"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "objc2", "CGColorSpace", "CGDataProvider", "CGImage"] }
objc2-quartz-core = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "CALayer", "CATransaction"] }
